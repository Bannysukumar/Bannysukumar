<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Banny Sukumar - Blockchain and Full-Stack Developer">
  <defs>
    <linearGradient id="bnr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="0.55" stop-color="#0d1b3e"/>
      <stop offset="1" stop-color="#071021"/>
    </linearGradient>
    <linearGradient id="bnr-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <pattern id="bnr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1c325c" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bnr-bg)"/>

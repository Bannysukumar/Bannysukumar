    <text x="70" y="150" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="2">Banny Sukumar</text>
    <text x="70" y="205" font-size="26" font-weight="600" fill="url(#bnr-text)">
      Blockchain &amp; Full-Stack Developer
    </text>
    <text x="70" y="252" font-size="18" fill="#8da8c7" font-family="Consolas, Fira Code, monospace">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="DevConnect Social Network API: REST and WebSocket backend with JWT access and rotating refresh tokens, Argon2id password hashing, end-to-end encrypted messaging, and Docker deployment. Stack: Java 17, Spring Boot 3.5, WebSockets, Docker.">
  <defs>
    <linearGradient id="cd-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="170" rx="10" fill="#0d1b3e" stroke="#1c325c"/>
  <rect x="0" y="14" width="5" height="142" rx="2.5" fill="url(#cd-accent)"/>
  <text x="34" y="48" font-size="26" font-weight="700" fill="#e6edf3"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">DevConnect &#8212; Social Network API</text>
  <text x="1166" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#8da8c7"
    font-family="Consolas, Fira Code, monospace">SOURCE ON GITHUB</text>
  <text x="34" y="82" font-size="16" fill="#a9c1dc"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">Independent REST + WebSocket service: JWT access and rotating refresh tokens,</text>
  <text x="34" y="105" font-size="16" fill="#a9c1dc"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">Argon2id hashing, E2E-encrypted messaging, profiles, friends, and Docker deploys.</text>
  <g font-family="Consolas, Fira Code, monospace" font-size="14" fill="#58a6ff">
    <rect x="34" y="124" width="88" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="78" y="143" text-anchor="middle">Java 17</text>
    <rect x="132" y="124" width="140" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="202" y="143" text-anchor="middle">Spring Boot 3.5</text>
    <rect x="282" y="124" width="110" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="337" y="143" text-anchor="middle">WebSockets</text>
    <rect x="402" y="124" width="82" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="443" y="143" text-anchor="middle">Docker</text>
  </g>
</svg>

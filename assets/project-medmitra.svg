<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="MedMitra: healthcare web application for managing medicines, prescriptions, and personal health records with Firebase authentication and storage. Stack: React, Vite, Firebase. Live demo verified on Vercel.">
  <defs>
    <linearGradient id="cmm-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="170" rx="10" fill="#0d1b3e" stroke="#1c325c"/>
  <rect x="0" y="14" width="5" height="142" rx="2.5" fill="url(#cmm-accent)"/>
  <text x="34" y="48" font-size="26" font-weight="700" fill="#e6edf3"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">MedMitra &#8212; Healthcare Records App</text>
  <text x="1166" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#39c5cf"
    font-family="Consolas, Fira Code, monospace">LIVE DEMO VERIFIED</text>
  <text x="34" y="82" font-size="16" fill="#a9c1dc"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">Healthcare web app for managing medicines, prescriptions, and personal health</text>
  <text x="34" y="105" font-size="16" fill="#a9c1dc"
    font-family="Segoe UI, Helvetica, Arial, sans-serif">records, with Firebase authentication and Firestore-backed data storage.</text>
  <g font-family="Consolas, Fira Code, monospace" font-size="14" fill="#58a6ff">
    <rect x="34" y="124" width="72" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="70" y="143" text-anchor="middle">React</text>
    <rect x="116" y="124" width="64" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="148" y="143" text-anchor="middle">Vite</text>
    <rect x="190" y="124" width="88" height="28" rx="14" fill="#11264d" stroke="#1c325c"/>
    <text x="234" y="143" text-anchor="middle">Firebase</text>
  </g>
</svg>
